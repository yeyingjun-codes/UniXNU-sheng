# Generated from the Codemagic sheng-package27 workflow.

# The Codemagic free plan is out of build minutes, so this mirrors the same

# steps on a GitHub-hosted macOS runner.

name: UniXNU sheng package 27 fence-fix

'on':

  workflow_dispatch: null
  push:
    branches:
      - fence-fix-v2

jobs:

  build:

    runs-on: macos-latest

    timeout-minutes: 180

    env:

      REPO_UNIXNU: https://github.com/UniXNU/UniXNU.git

      REPO_DEVICE: https://github.com/yeyingjun-codes/UniXNU-sheng.git

      REPO_UEFI: https://github.com/UniXNU/uefi-sheng.git

      UNIXNU_REF: f61fd6c1be8a18ec83c4a80bd7355cbf5d435d63

      DEVICE_REF: refs/heads/fence-fix-v2

      UNIXNU_UNIQUE_CHIP_ID: 9732b499

      HOMEBREW_NO_AUTO_UPDATE: '1'

      HOMEBREW_NO_INSTALL_CLEANUP: '1'

      HOMEBREW_NO_ENV_HINTS: '1'

      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

    - name: Runner info and disk headroom

      run: "set -euo pipefail\nsw_vers; uname -m\ndf -h / | tail -2\n# Pick the newest Xcode installed on the image.\nnewest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)\necho \"xcode candidates:\"; ls -d /Applications/Xcode*.app 2>/dev/null || true\nif [ -n \"$newest\" ]; then\n  echo \"selecting $newest\"\n  sudo xcode-select -s \"$newest/Contents/Developer\" || true\nfi\nxcodebuild -version || true\nxcrun --sdk iphoneos --show-sdk-version || true\n# Remove things this build does not need to keep the disk free.\nsudo rm -rf /Library/Developer/CoreSimulator/Caches/* 2>/dev/null || true\nsudo rm -rf \"$HOME/Library/Developer/Xcode/iOS DeviceSupport\"/* 2>/dev/null || true\ndf -h / | tail -2\n"

    - name: Host toolchain

      run: "set -euo pipefail\nbrew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup 2>&1 | tail -20\nexport RUSTUP_HOME=\"$HOME/.rustup\"\nexport CARGO_HOME=\"$HOME/.cargo\"\ncurl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh\nsh /tmp/rustup-init.sh -y --default-toolchain 1.98.0 --profile minimal --component rust-src --no-modify-path\nexport PATH=\"$CARGO_HOME/bin:$PATH\"\nfile \"$CARGO_HOME/bin/cargo\" || true\nver=\"$(cargo --version)\"\necho \"cargo --version => $ver\"\ncase \"$ver\" in cargo\\ 1.98.*) ;; *) echo \"FATAL: cargo proxy is not real cargo: $ver\"; exit 1;; esac\nrustc --version\necho \"check -Z acceptance\"\nRUSTC_BOOTSTRAP=1 cargo -Z help 2>&1 | head -3 || true\nllvm-as --version 2>/dev/null | head -1 || \"$(brew --prefix llvm)/bin/llvm-as\" --version | head -1\nmkdir -p \"$HOME/.local/bin\"\ncurl -fL --retry 3 -o /tmp/ipsw.tar.gz https://github.com/blacktop/ipsw/releases/download/v3.1.741/ipsw_3.1.741_macOS_arm64.tar.gz\ntar -xzf /tmp/ipsw.tar.gz -C \"$HOME/.local/bin\"\nchmod +x \"$HOME/.local/bin/ipsw\"\nexport PATH=\"$HOME/.local/bin:$PATH\"\necho \"IPSW_BIN=$HOME/.local/bin\" >> $GITHUB_ENV\nipsw version\nfor t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool mformat mcopy ipsw cargo rustc; do\n  command -v \"$t\" >/dev/null || { echo \"missing tool: $t\"; exit 1; }\ndone\npython3 -c 'import tomllib,sys; print(sys.version)'\nfor t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do\n  [ -x \"$(brew --prefix llvm)/bin/$t\" ] || [ -x \"$(brew --prefix lld)/bin/$t\" ] || { echo \"missing tool: $t\"; exit 1; }\ndone\nsw_vers; xcodebuild -version; uname -m\n"

    - name: Checkout official sources at pinned revisions

      run: 'set -euo pipefail



        ROOT="$GITHUB_WORKSPACE/pkg27"



        rm -rf "$ROOT"



        mkdir -p "$ROOT"



        cd "$ROOT"





        git init UniXNU



        git -C UniXNU remote add origin "$REPO_UNIXNU"



        git -C UniXNU fetch --depth 1 origin "$UNIXNU_REF"



        git -C UniXNU checkout --detach FETCH_HEAD



        git -C UniXNU submodule update --init --recursive --depth 1 --jobs 8





        git init device



        git -C device remote add origin "$REPO_DEVICE"



        git -C device fetch --depth 1 origin "$DEVICE_REF"



        git -C device checkout --detach FETCH_HEAD



        git -C device submodule update --init --recursive --depth 1 --jobs 8





        git clone --depth 1 --single-branch --branch sheng "$REPO_UEFI" uefi-sheng



        git -C uefi-sheng submodule update --init --recursive --depth 1 --jobs 8





        echo "UniXNU  $(git -C UniXNU rev-parse HEAD)"



        echo "device  $(git -C device rev-parse HEAD)"



        echo "uefi    $(git -C uefi-sheng rev-parse HEAD)"



        test -d uefi-sheng/Platforms/Xiaomi/shengPkg



        test -f device/scripts/package.sh



        '

    - name: Normalize upstream patch headers

      run: "set -euo pipefail\nROOT=\"$GITHUB_WORKSPACE/pkg27\"\npython3 - \"$ROOT\" <<'PY'\nimport pathlib\nimport sys\n\nroot = pathlib.Path(sys.argv[1])\nfixed = 0\nfor p in sorted(root.rglob('*.patch')):\n    raw = p.read_bytes().decode('utf-8', 'surrogateescape')\n    lines = raw.splitlines(keepends=True)\n    out = []\n    changed = False\n    for i, line in enumerate(lines):\n        out.append(line)\n        if not line.startswith('diff --git '):\n            continue\n        has_new_mode = False\n        dash = None\n        for k in range(i + 1, min(i + 12, len(lines))):\n            s = lines[k]\n            if s.startswith('new file mode'):\n                has_new_mode = True\n                break\n            if s.startswith('--- '):\n                dash = s.strip()\n                break\n        if dash == '--- /dev/null' and not has_new_mode:\n            out.append('new file mode 100644\\n')\n            changed = True\n    if changed:\n        p.write_bytes(''.join(out).encode('utf-8', 'surrogateescape'))\n        print('normalized', p)\n        fixed += 1\nprint('patches normalized:', fixed)\nPY\n"

    - name: Prepare driver source checkouts in non-cone sparse mode

      run: "set -euo pipefail\nROOT=\"$GITHUB_WORKSPACE/pkg27\"\npython3 - \"$ROOT\" <<'PY'\nimport json\nimport pathlib\nimport subprocess\nimport sys\n\ndrivers = pathlib.Path(sys.argv[1]) / \"device\" / \"drivers\"\nlocks = sorted(drivers.glob(\"*/tools/source-lock.json\"))\nprint(\"source locks:\", [str(p) for p in locks])\nfor lock_path in locks:\n    lock = json.loads(lock_path.read_text())\n    base = lock_path.parents[1]\n    for name in (\"linux\", \"freebsd\"):\n        src = lock.get(name)\n        if not src:\n            continue\n        dest = base / \"deps\" / name\n        if not dest.exists():\n            dest.parent.mkdir(parents=True, exist_ok=True)\n            cmd = [\"git\", \"clone\", \"--depth\", \"1\", \"--filter=blob:none\", \"--sparse\"]\n            if src.get(\"ref\"):\n                cmd += [\"--branch\", src[\"ref\"]]\n            cmd += [src[\"url\"], str(dest)]\n            print(\"clone\", name, src.get(\"ref\"), src[\"url\"])\n            subprocess.run(cmd, check=True)\n        subprocess.run([\"git\", \"-C\", str(dest), \"config\", \"core.sparseCheckoutCone\", \"false\"], check=True)\n        subprocess.run([\"git\", \"-C\", str(dest), \"sparse-checkout\", \"set\", \"--no-cone\", *src[\"paths\"]], check=True)\n        head = subprocess.run([\"git\", \"-C\", str(dest), \"rev-parse\", \"HEAD\"],\n                              capture_output=True, text=True).stdout.strip()\n        missing = [p for p in src.get(\"required\", []) if not (dest / p).is_file()]\n        print(name, \"revision\", head, \"expect\", src.get(\"commit\"), \"missing\", len(missing))\n        if head != src.get(\"commit\"):\n            sys.exit(\"%s: revision %s != locked %s\" % (name, head, src.get(\"commit\")))\n        if missing:\n            print(\"missing sample:\", missing[:5])\n            sys.exit(\"%s: %d required files missing\" % (name, len(missing)))\nprint(\"driver sources ready\")\nPY\n"

    - name: Patch 27 board link to compile the WiFi firmware loader

      run: "set -euo pipefail\nROOT=\"$GITHUB_WORKSPACE/pkg27\"\npython3 - \"$ROOT\" <<'PY'\nimport pathlib\nimport sys\n\np = pathlib.Path(sys.argv[1]) / \"device\" / \"scripts\" / \"build-gop-legacy-display-27.py\"\ntext = p.read_text()\nanchor = \"board_objects += [Path(line.split(' ', 1)[1]) for line in run(['python3', ROOT / 'scripts/build-ath12k-wifi.py'\"\nif \"package/WifiFirmware.c\" in text:\n    print(\"already compiles WifiFirmware.c\")\nelse:\n    if text.count(anchor) != 1:\n        sys.exit(\"anchor not found exactly once: %d\" % text.count(anchor))\n    inject = (\n        \"# Board: the WiFi firmware loader the probe calls (package/WifiFirmware.c in the device repo).\\n\"\n        \"if not (KITS / 'WifiFirmware.c').exists():\\n\"\n        \"    (KITS / 'WifiFirmware.c').write_bytes((DEVICE / 'package/WifiFirmware.c').read_bytes())\\n\"\n        \"compile_c(KITS / 'WifiFirmware.c', board_dir / 'WifiFirmware.o', 'bsd/DEVELOPMENT/kern_exec.o.json')\\n\"\n        \"board_objects.append(board_dir / 'WifiFirmware.o')\\n\"\n    )\n    p.write_text(text.replace(anchor, inject + anchor))\n    print(\"patched\", p)\nPY\n"

    - name: Select header_version 3 and fix the bootimg verify offset

      run: "set -euo pipefail\nROOT=\"$GITHUB_WORKSPACE/pkg27\"\npython3 -c \"import base64,pathlib;pathlib.Path('/tmp/fix_verify.py').write_bytes(base64.b64decode(''))\"\npython3 - \"$ROOT\" <<'PY'\nimport pathlib\nimport sys\n\np = pathlib.Path(sys.argv[1]) / \"device\" / \"board.toml\"\ntext = p.read_text()\nif '[\"bootimg\".\"image\"]' in text:\n    print(\"board.toml already overrides bootimg.image\")\nelse:\n    text = text.rstrip(\"\\n\") + '\\n\\n[\"bootimg\".\"image\"]\\n\"header_version\" = 3\\n'\n    p.write_text(text)\n    print(\"added [bootimg.image] header_version = 3\")\nPY\ngrep -n -A3 'bootimg\".\"image' \"$ROOT/device/board.toml\"\npython3 /tmp/fix_verify.py \"$ROOT/UniXNU/scripts/unixnu/bootimg.py\"\n"

    - name: Install the read-only process and UI probe

      run: 'set -euo pipefail



        ROOT="$GITHUB_WORKSPACE/pkg27"



        SRC="$GITHUB_WORKSPACE/ci/NativeUfs.probe15.cpp"



        DST="$ROOT/device/drivers/ShengUfs/NativeUfs.cpp"



        test -f "$SRC"



        test -f "$DST"



        cp "$DST" "$GITHUB_WORKSPACE/NativeUfs.before-probe15.cpp"



        cp "$SRC" "$DST"



        grep -n "processReportThread" "$DST"



        grep -n "if (probe == 15)" "$DST"



        shasum -a 256 "$GITHUB_WORKSPACE/NativeUfs.before-probe15.cpp" "$DST"



        '

    - name: Enable the original default framebuffer creation gate

      run: 'set -euo pipefail



        ROOT="$GITHUB_WORKSPACE/pkg27"



        python3 "$GITHUB_WORKSPACE/ci/enable_default_framebuffer.py" "$ROOT/device/scripts/legacy-display-24A446.json"



        grep -n ''"default_surface"'' "$ROOT/device/scripts/legacy-display-24A446.json"



        '

    - name: Pin AdrenoMetal to the main revision

      run: 'set -euo pipefail



        ROOT="$GITHUB_WORKSPACE/pkg27"



        python3 "$GITHUB_WORKSPACE/ci/pin_adreno_main.py" "$ROOT/UniXNU/components.toml"



        grep -n ''AdrenoMetal'' -A6 "$ROOT/UniXNU/components.toml"



        '

    - name: Patch Adreno submit early-return diagnostics

      run: 'set -euo pipefail



        ROOT="$GITHUB_WORKSPACE/pkg27"



        SRC="$ROOT/UniXNU/drivers/Adreno740/NativeAdrenoSubmit.cpp"



        python3 "$GITHUB_WORKSPACE/ci/patch_submit_fail_ci.py" "$SRC"



        grep -n ''SUBMIT_FAIL'' "$SRC" | head -5



        '

    - name: Add UniXNU probe logging

      run: 'set -euo pipefail



        ROOT="$GITHUB_WORKSPACE/pkg27"



        python3 -c "import base64,pathlib;pathlib.Path(''/tmp/apply_probe.py'').write_bytes(base64.b64decode(''''))"



        python3 /tmp/apply_probe.py "$ROOT/UniXNU/package/UniXNUPkg/Library/UniXNULib/Config.c"



        grep -n "probe: blockio\|probe: volume" "$ROOT/UniXNU/package/UniXNUPkg/Library/UniXNULib/Config.c"



        '

    - name: Patch the RAM disk driver to skip the bootloader vendor ramdisk

      run: 'set -euo pipefail



        ROOT="$GITHUB_WORKSPACE/pkg27"



        python3 -c "import base64,pathlib;pathlib.Path(''/tmp/apply_ramdisk.py'').write_bytes(base64.b64decode(''''))"



        python3 /tmp/apply_ramdisk.py "$ROOT/UniXNU/package/UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.c"



        grep -n "FindFatBootSector" "$ROOT/UniXNU/package/UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.c"



        '

    - name: Build package 27 with first-install Data seed

      run: "set -o pipefail\nROOT=\"$GITHUB_WORKSPACE/pkg27\"\ndf -h / | tail -2\nexport PATH=\"$HOME/.cargo/bin:$HOME/.local/bin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$(brew --prefix bison)/bin:$PATH\"\necho \"cargo: $(command -v cargo) $(cargo --version 2>&1)\"\nexport UNIXNU_UNIQUE_CHIP_ID=\"9732b499\"\nexport GITHUB_TOKEN=\"${GH_TOKEN:-}\"\ncd \"$ROOT/device\"\nset +e\nset +e\nscripts/package.sh --os 27 --uefi \"$ROOT/uefi-sheng\" --init-data 2>&1 | tee \"$GITHUB_WORKSPACE/package27.log\"\nrc=${PIPESTATUS[0]}\nset -e\necho \"=== package rc=$rc ===\"\nif [ \"$rc\" -ne 0 ]; then\n  BASE=\"$ROOT/UniXNU/out/sheng/ipados-27.0.1-24A446\"\n  if [ ! -f \"$BASE/boot/boot.img\" ] || [ ! -f \"$BASE/package.manifest.json\" ]; then\n    SRC_LOG=\"$BASE/sheng_ipados27/tree/build/sheng-source-storage/NativeUfs.log\"\n    echo \"=== ShengUfs compile errors with context ===\"\n    grep -n -B 4 -A 8 \"error:\" \"$SRC_LOG\" || true\n    exit \"$rc\"\n  fi\n  echo \"boot.img and package.manifest.json exist; continue to artifact verification\"\nfi\n"

    - name: Make no-setup Data seed (skip first-boot migration, plain framebuffer)
      run: |
        set -euo pipefail
        ROOT="$GITHUB_WORKSPACE/pkg27"
        SEED=$(find "$ROOT/UniXNU/out/sheng" -type f -name 'data.dbr' | head -1)
        test -n "$SEED" && echo "base seed: $SEED"
        # Reuse the upstream no-setup recipe on OUR first-install seed: remove
        # com.apple.migration.plist (27's first-boot migration kept every core busy for
        # 20+ minutes upstream, matching our GPU-idle/swap=0 black screen) and force
        # CAEnableDeepFramebuffer/Compression off, as in the recorded working boot.
        python3 "$ROOT/device/scripts/make-nosetup-seed27.py" "$SEED" "$GITHUB_WORKSPACE/nosetup/data-nosetup.dbr"
        shasum -a 256 "$GITHUB_WORKSPACE/nosetup/data-nosetup.dbr"
    - name: Collect images and Data seed

      run: "set -euo pipefail\nROOT=\"$GITHUB_WORKSPACE/pkg27\"\nOUT=\"$GITHUB_WORKSPACE/out27\"\nrm -rf \"$OUT\"; mkdir -p \"$OUT\"\ncp \"$GITHUB_WORKSPACE/package27.log\" \"$OUT/\" || true\n\nBASE=\"$ROOT/UniXNU/out/sheng/ipados-27.0.1-24A446\"\nfind \"$BASE\" -type f \\( -name 'boot.img' -o -name 'payload.img' -o -name 'kernel.macho' -o -name 'package.manifest.json' -o -name 'data.dbr' -o -name 'inputs.json' \\) -exec cp {} \"$OUT/\" \\; 2>/dev/null || true\nfind \"$ROOT/UniXNU/out/sheng\" -type f -name 'sheng.dtb' -exec cp {} \"$OUT/\" \\; 2>/dev/null || true\n\ncp \"$GITHUB_WORKSPACE/nosetup/data-nosetup.dbr\" \"$OUT/\" || true\ncd \"$OUT\"\nls -lh\nshasum -a 256 boot.img payload.img kernel.macho data.dbr 2>/dev/null || true\nfor f in boot.img payload.img data.dbr package.manifest.json; do\n  [ -f \"$f\" ] || echo \"MISSING $f\"\ndone\n"

    - name: Upload artifacts

      uses: actions/upload-artifact@v4

      with:

        name: out27

        path: out27/*

        if-no-files-found: error

