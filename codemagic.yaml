workflows:
  sheng-kernel:
    name: Build sheng kernel (16Crow pipeline + owner mount stage probes)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - github
      vars:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
    scripts:
      - name: Clone repos
        script: |
          set -e
          echo "GITHUB_TOKEN=$GH_TOKEN" >> $CM_ENV
          cd $CM_BUILD_DIR
          git clone --depth 1 --recurse-submodules --branch sheng-evidence https://github.com/16Crow/UniXNU-official-build.git main
          git clone --depth 1 --recurse-submodules https://github.com/16Crow/UniXNU-sheng.git device
          cd main
          chmod +x unixnu
          echo "MAIN_DIR=$CM_BUILD_DIR/main" >> $CM_ENV
          echo "DEVICE_DIR=$CM_BUILD_DIR/device" >> $CM_ENV
          echo "UNIXNU_DEVICE=$CM_BUILD_DIR/device" >> $CM_ENV
          echo "DEFCONFIG=sheng_defconfig" >> $CM_ENV
          echo "STEPS=kernel" >> $CM_ENV
      - name: Install host tools
        script: |
          set -e
          brew install llvm lld mtools dtc qemu unifdef cmake ninja
          echo "PATH=$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH" >> $CM_ENV
      - name: Verify tools
        script: |
          cd $MAIN_DIR
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          for t in git make clang cmake ninja unifdef ld.lld mformat mcopy dtc qemu-system-aarch64 shasum; do
            echo "$t=$(command -v $t || echo MISSING)"
          done
      - name: Select device
        script: |
          cd $MAIN_DIR
          ./unixnu defconfig "$DEFCONFIG"
      - name: Inject RamBlock fast path
        script: |
          set -x
          mkdir -p /tmp/ramblock
          cp ci/RamBlock/NativeRamBlock.cpp /tmp/ramblock/NativeRamBlock.cpp
          echo "source fastpath: $(grep -c 'data fastpath' /tmp/ramblock/NativeRamBlock.cpp)"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('main/scripts/unixnu/kernel.py')
          raw = p.read_bytes().decode('utf-8')
          if 'INJECT_RAMBLOCK' in raw:
              print('already patched')
          else:
              crlf = '\r\n' if '\r\n' in raw else '\n'
              block = (
                  '    _rb_shutil.copyfile("/tmp/ramblock/NativeRamBlock.cpp", str(ctx.tree / "drivers" / "RamBlock" / "NativeRamBlock.cpp"))' + crlf
                  + '    print("INJECT-RAMBLOCK-COPY", (ctx.tree / "drivers" / "RamBlock" / "NativeRamBlock.cpp").read_text().count("data fastpath"))' + crlf
              )
              target = '    build_archives(ctx, env)'
              # 放进 build_archives 内部：每个 archive 前都检查并覆盖一次
              inner_anchor = "        log(f'kernel: archive {index}/{len(entries)}: {entry}')"
              if inner_anchor not in raw:
                  raise SystemExit('inner anchor not found')
              inner_block = (
                  '        _rb_dst = ctx.tree / "drivers" / "RamBlock" / "NativeRamBlock.cpp"' + crlf
                  + '        _rb_dst.parent.mkdir(parents=True, exist_ok=True)' + crlf
                  + '        _rb_shutil.copyfile("/tmp/ramblock/NativeRamBlock.cpp", str(_rb_dst))' + crlf
                  + '        print("INJECT-RAMBLOCK", _rb_dst, _rb_dst.read_text().count("data fastpath"))' + crlf
              )
              raw = raw.replace('def build_archives(ctx, env):', 'def build_archives(ctx, env):' + crlf + '    import shutil as _rb_shutil', 1)
              raw = raw.replace(inner_anchor, inner_block + inner_anchor, 1)
              p.write_bytes(raw.encode('utf-8'))
              print('patched inside build_archives with', repr(crlf))
          import ast
          ast.parse(p.read_text(encoding='utf-8'))
          print('ast OK')
          PY
          grep -c "INJECT-RAMBLOCK" main/scripts/unixnu/kernel.py
      - name: Prepare evidence and build kernel
        script: |
          set -euo pipefail
          cd $MAIN_DIR
          export GITHUB_TOKEN=$GH_TOKEN
          export UNIXNU_DEVICE=$DEVICE_DIR
          export STEPS=kernel
          export DEFCONFIG=sheng_defconfig
          bash scripts/prepare-sheng-evidence.sh
          echo "=== PIPELINE DONE ==="
          ls -lh out/sheng/kernel/
          shasum -a 256 out/sheng/kernel/kernel.macho
          shasum -a 256 out/sheng/kernel/kernel.json
    artifacts:
      - main/out/sheng/kernel/kernel.macho
      - main/out/sheng/kernel/kernel.json
      - main/out/sheng/logs/*.log
