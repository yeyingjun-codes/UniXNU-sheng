workflows:
  sheng-firmware:
    name: UniXNU sheng firmware (official recipe, macOS)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        UEFI_REPO: "https://github.com/UniXNU/uefi-sheng.git"
        UEFI_BRANCH: "sheng"
        DRIVER_REPO: "https://github.com/UniXNU/UniXNU.git"
        DEVICE_REPO: "https://github.com/UniXNU/UniXNU-sheng.git"
        WORK: "$HOME/work"
        BUILD_TARGET: "DEBUG"
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
    scripts:
      - name: Host toolchain
        script: |
          set -e
          brew install llvm lld dtc mtools nasm acpica 2>&1 | tail -5 || true
          LLVM=$(brew --prefix llvm)
          echo "LLVM_BIN=$LLVM/bin" >> $CM_ENV
          for t in clang lld-link llvm-lib llvm-rc iasl nasm dtc mformat; do
            p=$(command -v $t || true)
            [ -z "$p" ] && [ -x "$LLVM/bin/$t" ] && p="$LLVM/bin/$t"
            printf '%-12s %s\n' "$t" "${p:-MISSING}"
          done
          sw_vers; uname -m
      - name: Checkout official sources
        script: |
          set -e
          mkdir -p "$WORK"; cd "$WORK"
          rm -rf uefi-sheng unixnu device
          git clone --depth 1 --single-branch --branch "$UEFI_BRANCH" "$UEFI_REPO" uefi-sheng
          git clone --depth 1 --single-branch "$DRIVER_REPO" unixnu
          git clone --depth 1 --single-branch "$DEVICE_REPO" device
          chmod +x unixnu/unixnu
          echo "uefi-sheng  $(git -C uefi-sheng rev-parse --short HEAD)"
          echo "unixnu      $(git -C unixnu rev-parse --short HEAD)"
          echo "device      $(git -C device rev-parse --short HEAD)"
          test -d uefi-sheng/Platforms/Xiaomi/shengPkg && echo "shengPkg present"
          echo "WORK=$WORK" >> $CM_ENV
      - name: Shallow submodules
        script: |
          set -e
          cd "$WORK/unixnu"
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --jobs 8
          cd "$WORK/device"
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --jobs 8 || true
      - name: Select device
        script: |
          set -e
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          cd "$WORK/unixnu"
          export UNIXNU_DEVICE="$WORK/device"
          ./unixnu defconfig sheng_defconfig -D "$WORK/device"
          ./unixnu status -D "$WORK/device" | head -25
      - name: Build package and firmware
        script: |
          mkdir -p "$CM_BUILD_DIR/artifacts"
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          cd "$WORK/unixnu"
          export UNIXNU_DEVICE="$WORK/device"
          set +e
          ./unixnu build package firmware --uefi "$WORK/uefi-sheng" \
            --target "$BUILD_TARGET" -j"$(sysctl -n hw.ncpu)" \
            2>&1 | tee "$CM_BUILD_DIR/artifacts/build.log"
          rc=${PIPESTATUS[0]}
          echo "=== build rc=$rc ===" | tee -a "$CM_BUILD_DIR/artifacts/build.log"
          for f in "$WORK"/unixnu/out/*/*/*/logs/*.log; do
            [ -f "$f" ] && cp "$f" "$CM_BUILD_DIR/artifacts/" 2>/dev/null
          done
          find "$WORK/uefi-sheng/Build" -name '*.fd' -exec cp {} "$CM_BUILD_DIR/artifacts/" \; 2>/dev/null
          find "$WORK/unixnu/out" -name 'sheng.dtb' -exec cp {} "$CM_BUILD_DIR/artifacts/" \; 2>/dev/null
          ls -la "$CM_BUILD_DIR/artifacts" | tee -a "$CM_BUILD_DIR/artifacts/build.log"
          exit 0
      - name: Collect artifacts
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/artifacts"
          find "$WORK/uefi-sheng/Build" -name '*.fd' -exec cp {} "$CM_BUILD_DIR/artifacts/" \; 2>/dev/null || true
          find "$WORK/unixnu/out" -name '*.log' -exec cp {} "$CM_BUILD_DIR/artifacts/" \; 2>/dev/null || true
          find "$WORK/unixnu/out" -name 'sheng.dtb' -exec cp {} "$CM_BUILD_DIR/artifacts/" \; 2>/dev/null || true
          ls -la "$CM_BUILD_DIR/artifacts" || true
    artifacts:
      - artifacts/*.fd
      - artifacts/*.dtb
      - artifacts/*.log

  sheng-package27:
    name: UniXNU sheng package 27 (official full build + first-install seed)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      groups:
        - github
      vars:
        REPO_UNIXNU: "https://github.com/UniXNU/UniXNU.git"
        REPO_DEVICE: "https://github.com/UniXNU/UniXNU-sheng.git"
        REPO_UEFI: "https://github.com/UniXNU/uefi-sheng.git"
        UNIXNU_REF: "f61fd6c1be8a18ec83c4a80bd7355cbf5d435d63"
        UNIXNU_UNIQUE_CHIP_ID: "9732b499"
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
    scripts:
      - name: Host toolchain
        script: |
          set -euo pipefail
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup 2>&1 | tail -20
          export RUSTUP_HOME="$HOME/.rustup"
          export CARGO_HOME="$HOME/.cargo"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --default-toolchain 1.98.0 --profile minimal --component rust-src --no-modify-path
          export PATH="$CARGO_HOME/bin:$PATH"
          file "$CARGO_HOME/bin/cargo" || true
          ver="$(cargo --version)"
          echo "cargo --version => $ver"
          case "$ver" in cargo\ 1.98.*) ;; *) echo "FATAL: cargo proxy is not real cargo: $ver"; exit 1;; esac
          rustc --version
          echo "check -Z acceptance"
          RUSTC_BOOTSTRAP=1 cargo -Z help 2>&1 | head -3 || true
          llvm-as --version 2>/dev/null | head -1 || "$(brew --prefix llvm)/bin/llvm-as" --version | head -1
          mkdir -p "$HOME/.local/bin"
          curl -fL --retry 3 -o /tmp/ipsw.tar.gz https://github.com/blacktop/ipsw/releases/download/v3.1.741/ipsw_3.1.741_macOS_arm64.tar.gz
          tar -xzf /tmp/ipsw.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/ipsw"
          export PATH="$HOME/.local/bin:$PATH"
          echo "IPSW_BIN=$HOME/.local/bin" >> $CM_ENV
          ipsw version
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool mformat mcopy ipsw cargo rustc; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; exit 1; }
          done
          python3 -c 'import tomllib,sys; print(sys.version)'
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -x "$(brew --prefix llvm)/bin/$t" ] || [ -x "$(brew --prefix lld)/bin/$t" ] || { echo "missing tool: $t"; exit 1; }
          done
          sw_vers; xcodebuild -version; uname -m

      - name: Checkout official sources at pinned revisions
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          cd "$ROOT"

          git init UniXNU
          git -C UniXNU remote add origin "$REPO_UNIXNU"
          git -C UniXNU fetch --depth 1 origin "$UNIXNU_REF"
          git -C UniXNU checkout --detach FETCH_HEAD
          git -C UniXNU submodule update --init --recursive --depth 1 --jobs 8

          git clone --depth 1 --single-branch --branch main "$REPO_DEVICE" device
          git -C device submodule update --init --recursive --depth 1 --jobs 8

          git clone --depth 1 --single-branch --branch sheng "$REPO_UEFI" uefi-sheng
          git -C uefi-sheng submodule update --init --recursive --depth 1 --jobs 8

          echo "UniXNU  $(git -C UniXNU rev-parse HEAD)"
          echo "device  $(git -C device rev-parse HEAD)"
          echo "uefi    $(git -C uefi-sheng rev-parse HEAD)"
          test -d uefi-sheng/Platforms/Xiaomi/shengPkg
          test -f device/scripts/package.sh

      - name: Normalize upstream patch headers
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          python3 - "$ROOT" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          fixed = 0
          for p in sorted(root.rglob('*.patch')):
              raw = p.read_bytes().decode('utf-8', 'surrogateescape')
              lines = raw.splitlines(keepends=True)
              out = []
              changed = False
              for i, line in enumerate(lines):
                  out.append(line)
                  if not line.startswith('diff --git '):
                      continue
                  has_new_mode = False
                  dash = None
                  for k in range(i + 1, min(i + 12, len(lines))):
                      s = lines[k]
                      if s.startswith('new file mode'):
                          has_new_mode = True
                          break
                      if s.startswith('--- '):
                          dash = s.strip()
                          break
                  if dash == '--- /dev/null' and not has_new_mode:
                      out.append('new file mode 100644\n')
                      changed = True
              if changed:
                  p.write_bytes(''.join(out).encode('utf-8', 'surrogateescape'))
                  print('normalized', p)
                  fixed += 1
          print('patches normalized:', fixed)
          PY

      - name: Prepare driver source checkouts in non-cone sparse mode
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          python3 - "$ROOT" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          drivers = pathlib.Path(sys.argv[1]) / "device" / "drivers"
          locks = sorted(drivers.glob("*/tools/source-lock.json"))
          print("source locks:", [str(p) for p in locks])
          for lock_path in locks:
              lock = json.loads(lock_path.read_text())
              base = lock_path.parents[1]
              for name in ("linux", "freebsd"):
                  src = lock.get(name)
                  if not src:
                      continue
                  dest = base / "deps" / name
                  if not dest.exists():
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      cmd = ["git", "clone", "--depth", "1", "--filter=blob:none", "--sparse"]
                      if src.get("ref"):
                          cmd += ["--branch", src["ref"]]
                      cmd += [src["url"], str(dest)]
                      print("clone", name, src.get("ref"), src["url"])
                      subprocess.run(cmd, check=True)
                  subprocess.run(["git", "-C", str(dest), "config", "core.sparseCheckoutCone", "false"], check=True)
                  subprocess.run(["git", "-C", str(dest), "sparse-checkout", "set", "--no-cone", *src["paths"]], check=True)
                  head = subprocess.run(["git", "-C", str(dest), "rev-parse", "HEAD"],
                                        capture_output=True, text=True).stdout.strip()
                  missing = [p for p in src.get("required", []) if not (dest / p).is_file()]
                  print(name, "revision", head, "expect", src.get("commit"), "missing", len(missing))
                  if head != src.get("commit"):
                      sys.exit("%s: revision %s != locked %s" % (name, head, src.get("commit")))
                  if missing:
                      print("missing sample:", missing[:5])
                      sys.exit("%s: %d required files missing" % (name, len(missing)))
          print("driver sources ready")
          PY

      - name: Compile the WiFi firmware loader into the display board link
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          python3 - "$ROOT" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          # The display board scripts live in the device repository (device/scripts); keep the
          # UniXNU checkout as a fallback so this step does not depend on the layout du jour.
          script_dirs = [root / "device" / "scripts", root / "UniXNU" / "scripts"]

          NL = chr(10)

          # ipados-27 style: the display script keeps a board object list of its own.
          anchor27 = "board_objects += [Path(line.split(' ', 1)[1]) for line in run(['python3', ROOT / 'scripts/build-ath12k-wifi.py'"
          inject27 = NL.join([
              "# Board: the WiFi firmware loader the probe calls (package/WifiFirmware.c in the device repo).",
              "if not (KITS / 'WifiFirmware.c').exists():",
              "    (KITS / 'WifiFirmware.c').write_bytes((DEVICE / 'package/WifiFirmware.c').read_bytes())",
              "compile_c(KITS / 'WifiFirmware.c', board_dir / 'WifiFirmware.o', 'bsd/DEVELOPMENT/kern_exec.o.json')",
              "board_objects.append(board_dir / 'WifiFirmware.o')",
              "",
          ])

          # ipados-17 style: plain C sources are listed explicitly and all of them join the
          # archive. kits/sheng is created by the packaging deps step, so stage the file here.
          anchor17 = "backlight_c=[ROOT/'kits/sheng/GeniI2c.c']"
          replacement17 = NL.join([
              "# Board: stage the WiFi firmware loader the probe calls, then build it with the other",
              "# board C sources. package/WifiFirmware.c lives in the device repository, not in Git.",
              "import os as _wifi_os",
              "_wifi_sources = []",
              "if _wifi_os.environ.get('UNIXNU_DEVICE'):",
              "    _wifi_sources.append(Path(_wifi_os.environ['UNIXNU_DEVICE']) / 'package' / 'WifiFirmware.c')",
              "_wifi_sources += [ROOT / 'package' / 'WifiFirmware.c', ROOT.parent / 'device' / 'package' / 'WifiFirmware.c']",
              "_wifi_source = next((p for p in _wifi_sources if p.is_file()), None)",
              "if _wifi_source is None:",
              "    raise SystemExit('WifiFirmware.c not found; looked in %s' % [str(p) for p in _wifi_sources])",
              "(ROOT / 'kits/sheng' / 'WifiFirmware.c').write_bytes(_wifi_source.read_bytes())",
              "print('staged the WiFi firmware loader from', _wifi_source)",
              "backlight_c=[ROOT/'kits/sheng/GeniI2c.c',ROOT/'kits/sheng/WifiFirmware.c']",
          ])

          patched = 0
          seen = []
          for scripts in script_dirs:
              if not scripts.is_dir():
                  continue
              for path in sorted(scripts.glob("build-gop-legacy-display*.py")):
                  seen.append(str(path))
                  text = path.read_text()
                  if "WifiFirmware.c" in text:
                      print("already compiles WifiFirmware.c:", path)
                      patched += 1
                      continue
                  if text.count(anchor27) == 1:
                      path.write_text(text.replace(anchor27, inject27 + anchor27, 1))
                      print("patched (27 layout):", path)
                      patched += 1
                  elif text.count(anchor17) == 1:
                      path.write_text(text.replace(anchor17, replacement17, 1))
                      print("patched (17 layout):", path)
                      patched += 1
                  else:
                      sys.exit("no known anchor in %s (27-style %d, 17-style %d)"
                               % (path, text.count(anchor27), text.count(anchor17)))

          if not patched:
              sys.exit("no build-gop-legacy-display*.py found; looked in %s" % seen)
          PY
          grep -rn "WifiFirmware" "$ROOT"/device/scripts/build-gop-legacy-display*.py

      - name: Select header_version 3 and fix the bootimg verify offset
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          python3 -c "import base64,pathlib;pathlib.Path('/tmp/fix_verify.py').write_bytes(base64.b64decode(''))"
          python3 - "$ROOT" <<'PY'
          import pathlib
          import sys

          p = pathlib.Path(sys.argv[1]) / "device" / "board.toml"
          text = p.read_text()
          if '["bootimg"."image"]' in text:
              print("board.toml already overrides bootimg.image")
          else:
              text = text.rstrip("\n") + '\n\n["bootimg"."image"]\n"header_version" = 3\n'
              p.write_text(text)
              print("added [bootimg.image] header_version = 3")
          PY
          grep -n -A3 'bootimg"."image' "$ROOT/device/board.toml"
          python3 /tmp/fix_verify.py "$ROOT/UniXNU/scripts/unixnu/bootimg.py"

      - name: Drop the prelink-dependent virtio bindings from the 17 kernel archives
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          python3 - "$ROOT" <<'PY'
          import sys
          from pathlib import Path

          # build-virtio-mmio-bindings.py (and audit-storage-interface.py before it) read
          # build/xnu-prelink/native-apfs-load-positive.macho, a prelink candidate that only the
          # prelink step writes, and that step runs after the archives: the ipados-17.7.11 list
          # cannot be satisfied in one clean pass. The 26 and 27 profiles ship the same
          # component:VirtioMmioBlock and component:RamBlock entries, build no virtio bindings,
          # and link, so the binding archives are not required by the kernel link. Drop just
          # those two entries and keep the components.
          drop = [
              '"build-virtio-mmio-bindings.py --component RamBlock --directory build/ram-block", ',
              '"build-virtio-mmio-bindings.py --component VirtioMmioBlock", ',
          ]
          header = '["os_overrides"."ipados-17.7.11-21H461"."kernel"]'

          p = Path(sys.argv[1]) / "device" / "board.toml"
          lines = p.read_text().splitlines(True)
          start = next((i for i, line in enumerate(lines) if line.strip() == header), None)
          if start is None:
              sys.exit("board.toml has no %s table" % header)

          end = len(lines)
          for i in range(start + 1, len(lines)):
              if lines[i].strip().startswith("["):
                  end = i
                  break

          block = "".join(lines[start:end])
          removed = 0
          for entry in drop:
              if entry in block:
                  block = block.replace(entry, "", 1)
                  removed += 1

          if removed:
              lines[start:end] = [block]
              p.write_text("".join(lines))
              print("dropped %d virtio binding entries from the 17 archives" % removed)
          else:
              print("the 17 archives carry no virtio bindings")
          PY
          grep -c "build-virtio-mmio-bindings" "$ROOT/device/board.toml" || true
          grep -c "component:RamBlock" "$ROOT/device/board.toml" || true
          grep -c "component:VirtioMmioBlock" "$ROOT/device/board.toml" || true

      - name: Fit the payload into the 192 MiB boot partition
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          python3 - "$ROOT" <<'PY'
          import sys
          from pathlib import Path

          # The ipados-17.7.11 override asks for a 208 MiB payload. Packed as the boot image
          # ramdisk that is larger than boot_b (0xC000000 = 192 MiB), so the flash would be
          # refused before anything boots. 176 MiB is what the 27 image already used and it
          # leaves roughly 14 MiB of headroom for the kernel and the header pages.
          NL = chr(10)
          p = Path(sys.argv[1]) / "device" / "board.toml"
          lines = p.read_text().splitlines(True)
          header = '["os_overrides"."ipados-17.7.11-21H461"."payload"]'

          start = next((i for i, line in enumerate(lines) if line.strip() == header), None)
          if start is None:
              sys.exit("board.toml has no %s table" % header)

          i = start + 1
          replaced = False
          while i < len(lines):
              stripped = lines[i].strip()
              if stripped.startswith("["):
                  break
              if stripped.startswith('"size_mib"'):
                  lines[i] = '"size_mib" = 176' + NL
                  replaced = True
                  break
              i += 1

          # The override inherits [payload] size_mib when the block has no entry of its own.
          if not replaced:
              lines.insert(start + 1, '"size_mib" = 176' + NL)

          p.write_text("".join(lines))
          print("ipados-17.7.11 payload size is now 176 MiB")
          print("".join(lines[start:start + 3]))
          PY
          grep -n '"size_mib"' "$ROOT/device/board.toml"

      - name: Add UniXNU probe logging
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          python3 -c "import base64,pathlib;pathlib.Path('/tmp/apply_probe.py').write_bytes(base64.b64decode(''))"
          python3 /tmp/apply_probe.py "$ROOT/UniXNU/package/UniXNUPkg/Library/UniXNULib/Config.c"
          grep -n "probe: blockio\|probe: volume" "$ROOT/UniXNU/package/UniXNUPkg/Library/UniXNULib/Config.c"

      - name: Patch the RAM disk driver to skip the bootloader vendor ramdisk
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          python3 -c "import base64,pathlib;pathlib.Path('/tmp/apply_ramdisk.py').write_bytes(base64.b64decode(''))"
          python3 /tmp/apply_ramdisk.py "$ROOT/UniXNU/package/UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.c"
          grep -n "FindFatBootSector" "$ROOT/UniXNU/package/UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.c"

      - name: Build the ipados 17.7.11 package with the packed Data seed
        script: |
          set -o pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$(brew --prefix bison)/bin:$PATH"
          echo "cargo: $(command -v cargo) $(cargo --version 2>&1)"
          export UNIXNU_UNIQUE_CHIP_ID="9732b499"
          export GITHUB_TOKEN="${GH_TOKEN:-}"
          cd "$ROOT/device"
          set +e
          SEED="$CM_BUILD_DIR/ci/data-seed.dbr"
          if [ ! -f "$SEED" ]; then echo "FATAL: the packed Data seed is missing: $SEED"; exit 1; fi
          ls -l "$SEED"
          scripts/package.sh --os 17 --uefi "$ROOT/uefi-sheng" \
            --data-ramdisk "$SEED" 2>&1 | tee "$CM_BUILD_DIR/package17.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "=== package rc=$rc ==="
          exit "$rc"

      - name: Collect images and Data seed
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          OUT="$CM_BUILD_DIR/out27"
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$CM_BUILD_DIR/package17.log" "$OUT/" || true

          BASE="$ROOT/UniXNU/out/sheng/ipados-17.7.11-21H461"
          find "$BASE" -type f \( -name 'boot.img' -o -name 'payload.img' -o -name 'kernel.macho' -o -name 'package.manifest.json' -o -name 'data.dbr' -o -name 'inputs.json' \) -exec cp {} "$OUT/" \; 2>/dev/null || true
          find "$ROOT/UniXNU/out/sheng" -type f -name 'sheng.dtb' -exec cp {} "$OUT/" \; 2>/dev/null || true

          cd "$OUT"
          ls -lh
          shasum -a 256 boot.img payload.img kernel.macho data.dbr 2>/dev/null || true
          for f in boot.img payload.img data.dbr package.manifest.json; do
            [ -f "$f" ] || echo "MISSING $f"
          done

    artifacts:
      - out27/*
  sheng-userdata27:
    name: UniXNU sheng ipados 27.0.1 userdata (build userdata-root.img from the IPSW)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        REPO_UNIXNU: "https://github.com/UniXNU/UniXNU.git"
        REPO_DEVICE: "https://github.com/UniXNU/UniXNU-sheng.git"
        UNIXNU_REF: "f61fd6c1be8a18ec83c4a80bd7355cbf5d435d63"
        UNIXNU_UNIQUE_CHIP_ID: "9732b499"
        IPSW_URL: "https://updates.cdn-apple.com/2026FallFCS/6074e110-d48d-40c2-b0e8-b611520941a3/iPad17,1,iPad17,2,iPad17,3,iPad17,4_27.0.1_24A446_Restore.ipsw"
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
    scripts:
      - name: Reclaim runner disk
        script: |
          set -euo pipefail
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData" 2>/dev/null || true
          echo "free:" && df -h / | tail -1

      - name: Host toolchain
        script: |
          set -euo pipefail
          brew install python@3.12 ipsw zstd xz 2>&1 | tail -6 || true
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          ipsw version || true
          python3 -c 'import tomllib,sys; print(sys.version)'
          sw_vers; uname -m

      - name: Checkout device and UniXNU sources
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/ud27"
          rm -rf "$ROOT"; mkdir -p "$ROOT"; cd "$ROOT"
          git init UniXNU
          git -C UniXNU remote add origin "$REPO_UNIXNU"
          git -C UniXNU fetch --depth 1 origin "$UNIXNU_REF"
          git -C UniXNU checkout --detach FETCH_HEAD
          git -C UniXNU submodule update --init --recursive --depth 1 --jobs 8
          git clone --depth 1 --single-branch --branch main "$REPO_DEVICE" device
          git -C device submodule update --init --recursive --depth 1 --jobs 8 || true
          chmod +x UniXNU/unixnu
          echo "UniXNU  $(git -C UniXNU rev-parse --short HEAD)"
          echo "device  $(git -C device rev-parse --short HEAD)"
          test -x UniXNU/unixnu || exit 1

      - name: Package prerequisites (deps)
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/ud27"
          cd "$ROOT/device"
          export UNIXNU_UNIQUE_CHIP_ID="$UNIXNU_UNIQUE_CHIP_ID"
          export GITHUB_TOKEN="${GH_TOKEN:-}"
          echo "github token: ${GH_TOKEN:+present}"
          # package.sh runs deps/preflight; verbose so a failure is readable.
          ./scripts/package.sh --os 27 --check 2>&1 | tail -40 || true

      - name: Fetch the iPadOS 27.0.1 IPSW
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/ud27"
          cd "$ROOT"
          ls -lh restore.ipsw 2>/dev/null || true
          if [ ! -s restore.ipsw ]; then
            curl -fL --retry 3 --connect-timeout 30 -o restore.ipsw "$IPSW_URL" 2>&1 | tail -3
          fi
          shasum -a 256 restore.ipsw
          ls -lh restore.ipsw

      - name: Build the userdata image for the 27 OS profile
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/ud27"
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$HOME/.local/bin:$PATH"
          # Point UNIXNU_DEVICE at the device checkout so board.toml/userdata windows come from it.
          export UNIXNU_DEVICE="$ROOT/device"
          cd "$ROOT/UniXNU"
          # cli.py: build takes the steps list as a positional argument (all/kernel/.../userdata).
          set +e
          python3 "$ROOT/UniXNU/unixnu" -D "$ROOT/device" build userdata \
            --ipsw "$ROOT/restore.ipsw" 2>&1 | tee "$CM_BUILD_DIR/userdata.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "=== userdata build rc=$rc ==="
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

      - name: Verify and collect userdata-root.img
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/ud27"
          IMG=$(find "$ROOT/UniXNU/out" -name 'userdata-root.img' | head -1)
          [ -n "$IMG" ] || { echo "no userdata-root.img produced"; exit 1; }
          cp "$IMG" "$CM_BUILD_DIR/userdata-root.img"
          JSON=$(find "$ROOT/UniXNU/out" -name 'userdata-root.json' | head -1 || true)
          [ -n "$JSON" ] && cp "$JSON" "$CM_BUILD_DIR/userdata-root.json" || true
          cp "$CM_BUILD_DIR/userdata.log" "$CM_BUILD_DIR/" 2>/dev/null || true
          ls -lh "$CM_BUILD_DIR/userdata-root.img"
          python3 - "$CM_BUILD_DIR/userdata-root.img" <<'PY'
          import struct, sys
          d = open(__import__('sys').argv[1], 'rb').read(4096)
          print('magic', d[:8])
          print('version', struct.unpack_from('<I', d, 8)[0], 'windows', struct.unpack_from('<I', d, 12)[0])
          print('image_bytes', struct.unpack_from('<Q', d, 16)[0])
          for i in range(struct.unpack_from('<I', d, 12)[0]):
              o = 24 + 128 * i
              name = d[o:o+32].rstrip(b'\x00').decode('latin1')
              off, size = struct.unpack_from('<QQ', d, o+32)
              bs, fl = struct.unpack_from('<2I', d, o+48)
              print('  ', name, 'offset', off, 'size', size, 'bs', bs, 'flags', fl)
          PY

    artifacts:
      - userdata-root.img
      - userdata-root.json
      - userdata.log
