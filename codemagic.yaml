workflows:
  xnu-kernel:
    name: Build XNU kernel for sheng
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - github
    scripts:
      - name: Clone repos
        script: |
          set -e
          echo "GITHUB_TOKEN=$GH_TOKEN" >> $CM_ENV
          cd $CM_BUILD_DIR
          git clone --depth 1 --recurse-submodules https://github.com/UniXNU/UniXNU.git main
          git clone --depth 1 --recurse-submodules https://github.com/16Crow/UniXNU-sheng.git device
          cd main
          chmod +x unixnu
          echo "MAIN_DIR=$CM_BUILD_DIR/main" >> $CM_ENV
          echo "DEVICE_DIR=$CM_BUILD_DIR/device" >> $CM_ENV
      - name: Install host tools
        script: |
          cd $MAIN_DIR
          brew install cmake ninja unifdef llvm mtools dtc lld
          echo "PATH=$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH" >> $CM_ENV
      - name: Verify tools
        script: |
          cd $MAIN_DIR
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          for tool in git make clang cmake ninja unifdef ld.lld mformat mcopy dtc xcodebuild; do
            echo "$tool = $(command -v "$tool" || echo MISSING)"
          done
      - name: Fetch sources and IPSW
        script: |
          cd $MAIN_DIR
          python3 ./unixnu defconfig sheng_defconfig -D $DEVICE_DIR
          python3 ./unixnu fetch -D $DEVICE_DIR
          python3 ./unixnu ipsw fetch -D $DEVICE_DIR
      - name: Build kernel
        script: |
          cd $MAIN_DIR
          set +e
          python3 ./unixnu build kernel -D $DEVICE_DIR
          RC=$?
          set -e
          echo "=== BUILD KERNEL EXIT: $RC ==="
          echo "=== software-aes dir ==="
          ls -la $MAIN_DIR/out/sheng/*/tree/build/software-aes/ 2>/dev/null || echo "NO software-aes dir"
          echo "=== find NativeAES artifacts ==="
          find $MAIN_DIR/out -name '*NativeAES*' 2>/dev/null | head -20
          echo "=== compile log if any ==="
          find $MAIN_DIR/out -path '*software-aes*' -name 'compile.log' -exec tail -20 {} \; 2>/dev/null
          exit $RC
    artifacts:
      - main/out/**/kernel/kernel.macho
      - main/out/**/kernel/kernel.json
      - main/out/**/logs/*.log
