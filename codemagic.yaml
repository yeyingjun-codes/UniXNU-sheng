workflows:
  sheng-firmware:
    name: UniXNU sheng firmware (official recipe, macOS)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        UEFI_REPO: "https://github.com/UniXNU/uefi-sheng.git"
        UEFI_BRANCH: "sheng"
        DRIVER_REPO: "https://github.com/UniXNU/UniXNU.git"
        DEVICE_REPO: "https://github.com/UniXNU/UniXNU-sheng.git"
        WORK: "$HOME/work"
        BUILD_TARGET: "DEBUG"
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
    scripts:
      - name: Host toolchain
        script: |
          set -e
          brew install llvm lld dtc mtools nasm acpica 2>&1 | tail -5 || true
          LLVM=$(brew --prefix llvm)
          echo "LLVM_BIN=$LLVM/bin" >> $CM_ENV
          for t in clang lld-link llvm-lib llvm-rc iasl nasm dtc mformat; do
            p=$(command -v $t || true)
            [ -z "$p" ] && [ -x "$LLVM/bin/$t" ] && p="$LLVM/bin/$t"
            printf '%-12s %s\n' "$t" "${p:-MISSING}"
          done
          sw_vers; uname -m
      - name: Checkout official sources
        script: |
          set -e
          mkdir -p "$WORK"; cd "$WORK"
          rm -rf uefi-sheng unixnu device
          git clone --depth 1 --single-branch --branch "$UEFI_BRANCH" "$UEFI_REPO" uefi-sheng
          git clone --depth 1 --single-branch "$DRIVER_REPO" unixnu
          git clone --depth 1 --single-branch "$DEVICE_REPO" device
          chmod +x unixnu/unixnu
          echo "uefi-sheng  $(git -C uefi-sheng rev-parse --short HEAD)"
          echo "unixnu      $(git -C unixnu rev-parse --short HEAD)"
          echo "device      $(git -C device rev-parse --short HEAD)"
          test -d uefi-sheng/Platforms/Xiaomi/shengPkg && echo "shengPkg present"
          echo "WORK=$WORK" >> $CM_ENV
      - name: Shallow submodules
        script: |
          set -e
          cd "$WORK/unixnu"
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --jobs 8
          cd "$WORK/device"
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --jobs 8 || true
      - name: Select device
        script: |
          set -e
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          cd "$WORK/unixnu"
          export UNIXNU_DEVICE="$WORK/device"
          ./unixnu defconfig sheng_defconfig -D "$WORK/device"
          ./unixnu status -D "$WORK/device" | head -25
      - name: Build package and firmware
        script: |
          mkdir -p "$CM_BUILD_DIR/artifacts"
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          cd "$WORK/unixnu"
          export UNIXNU_DEVICE="$WORK/device"
          set +e
          ./unixnu build package firmware --uefi "$WORK/uefi-sheng" \
            --target "$BUILD_TARGET" -j"$(sysctl -n hw.ncpu)" \
            2>&1 | tee "$CM_BUILD_DIR/artifacts/build.log"
          rc=${PIPESTATUS[0]}
          echo "=== build rc=$rc ===" | tee -a "$CM_BUILD_DIR/artifacts/build.log"
          for f in "$WORK"/unixnu/out/*/*/*/logs/*.log; do
            [ -f "$f" ] && cp "$f" "$CM_BUILD_DIR/artifacts/" 2>/dev/null
          done
          find "$WORK/uefi-sheng/Build" -name '*.fd' -exec cp {} "$CM_BUILD_DIR/artifacts/" \; 2>/dev/null
          find "$WORK/unixnu/out" -name 'sheng.dtb' -exec cp {} "$CM_BUILD_DIR/artifacts/" \; 2>/dev/null
          ls -la "$CM_BUILD_DIR/artifacts" | tee -a "$CM_BUILD_DIR/artifacts/build.log"
          exit 0
      - name: Collect artifacts
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/artifacts"
          find "$WORK/uefi-sheng/Build" -name '*.fd' -exec cp {} "$CM_BUILD_DIR/artifacts/" \; 2>/dev/null || true
          find "$WORK/unixnu/out" -name '*.log' -exec cp {} "$CM_BUILD_DIR/artifacts/" \; 2>/dev/null || true
          find "$WORK/unixnu/out" -name 'sheng.dtb' -exec cp {} "$CM_BUILD_DIR/artifacts/" \; 2>/dev/null || true
          ls -la "$CM_BUILD_DIR/artifacts" || true
    artifacts:
      - artifacts/*.fd
      - artifacts/*.dtb
      - artifacts/*.log

  sheng-package27:
    name: UniXNU sheng package 27 (official full build + first-install seed)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      groups:
        - github
      vars:
        REPO_UNIXNU: "https://github.com/UniXNU/UniXNU.git"
        REPO_DEVICE: "https://github.com/UniXNU/UniXNU-sheng.git"
        REPO_UEFI: "https://github.com/UniXNU/uefi-sheng.git"
        UNIXNU_REF: "f61fd6c1be8a18ec83c4a80bd7355cbf5d435d63"
        UNIXNU_UNIQUE_CHIP_ID: "9732b499"
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
    scripts:
      - name: Host toolchain
        script: |
          set -euo pipefail
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup 2>&1 | tail -20
          export RUSTUP_HOME="$HOME/.rustup"
          export CARGO_HOME="$HOME/.cargo"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --default-toolchain 1.98.0 --profile minimal --component rust-src --no-modify-path
          export PATH="$CARGO_HOME/bin:$PATH"
          file "$CARGO_HOME/bin/cargo" || true
          ver="$(cargo --version)"
          echo "cargo --version => $ver"
          case "$ver" in cargo\ 1.98.*) ;; *) echo "FATAL: cargo proxy is not real cargo: $ver"; exit 1;; esac
          rustc --version
          echo "check -Z acceptance"
          RUSTC_BOOTSTRAP=1 cargo -Z help 2>&1 | head -3 || true
          llvm-as --version 2>/dev/null | head -1 || "$(brew --prefix llvm)/bin/llvm-as" --version | head -1
          mkdir -p "$HOME/.local/bin"
          curl -fL --retry 3 -o /tmp/ipsw.tar.gz https://github.com/blacktop/ipsw/releases/download/v3.1.741/ipsw_3.1.741_macOS_arm64.tar.gz
          tar -xzf /tmp/ipsw.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/ipsw"
          export PATH="$HOME/.local/bin:$PATH"
          echo "IPSW_BIN=$HOME/.local/bin" >> $CM_ENV
          ipsw version
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool mformat mcopy ipsw cargo rustc; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; exit 1; }
          done
          python3 -c 'import tomllib,sys; print(sys.version)'
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -x "$(brew --prefix llvm)/bin/$t" ] || [ -x "$(brew --prefix lld)/bin/$t" ] || { echo "missing tool: $t"; exit 1; }
          done
          sw_vers; xcodebuild -version; uname -m

      - name: Checkout official sources at pinned revisions
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          cd "$ROOT"

          git init UniXNU
          git -C UniXNU remote add origin "$REPO_UNIXNU"
          git -C UniXNU fetch --depth 1 origin "$UNIXNU_REF"
          git -C UniXNU checkout --detach FETCH_HEAD
          git -C UniXNU submodule update --init --recursive --depth 1 --jobs 8

          git clone --depth 1 --single-branch --branch main "$REPO_DEVICE" device
          git -C device submodule update --init --recursive --depth 1 --jobs 8

          git clone --depth 1 --single-branch --branch sheng "$REPO_UEFI" uefi-sheng
          git -C uefi-sheng submodule update --init --recursive --depth 1 --jobs 8

          echo "UniXNU  $(git -C UniXNU rev-parse HEAD)"
          echo "device  $(git -C device rev-parse HEAD)"
          echo "uefi    $(git -C uefi-sheng rev-parse HEAD)"
          test -d uefi-sheng/Platforms/Xiaomi/shengPkg
          test -f device/scripts/package.sh

      - name: Normalize upstream patch headers
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          python3 - "$ROOT" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          fixed = 0
          for p in sorted(root.rglob('*.patch')):
              raw = p.read_bytes().decode('utf-8', 'surrogateescape')
              lines = raw.splitlines(keepends=True)
              out = []
              changed = False
              for i, line in enumerate(lines):
                  out.append(line)
                  if not line.startswith('diff --git '):
                      continue
                  has_new_mode = False
                  dash = None
                  for k in range(i + 1, min(i + 12, len(lines))):
                      s = lines[k]
                      if s.startswith('new file mode'):
                          has_new_mode = True
                          break
                      if s.startswith('--- '):
                          dash = s.strip()
                          break
                  if dash == '--- /dev/null' and not has_new_mode:
                      out.append('new file mode 100644\n')
                      changed = True
              if changed:
                  p.write_bytes(''.join(out).encode('utf-8', 'surrogateescape'))
                  print('normalized', p)
                  fixed += 1
          print('patches normalized:', fixed)
          PY

      - name: Prepare driver source checkouts in non-cone sparse mode
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          python3 - "$ROOT" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          drivers = pathlib.Path(sys.argv[1]) / "device" / "drivers"
          locks = sorted(drivers.glob("*/tools/source-lock.json"))
          print("source locks:", [str(p) for p in locks])
          for lock_path in locks:
              lock = json.loads(lock_path.read_text())
              base = lock_path.parents[1]
              for name in ("linux", "freebsd"):
                  src = lock.get(name)
                  if not src:
                      continue
                  dest = base / "deps" / name
                  if not dest.exists():
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      cmd = ["git", "clone", "--depth", "1", "--filter=blob:none", "--sparse"]
                      if src.get("ref"):
                          cmd += ["--branch", src["ref"]]
                      cmd += [src["url"], str(dest)]
                      print("clone", name, src.get("ref"), src["url"])
                      subprocess.run(cmd, check=True)
                  subprocess.run(["git", "-C", str(dest), "config", "core.sparseCheckoutCone", "false"], check=True)
                  subprocess.run(["git", "-C", str(dest), "sparse-checkout", "set", "--no-cone", *src["paths"]], check=True)
                  head = subprocess.run(["git", "-C", str(dest), "rev-parse", "HEAD"],
                                        capture_output=True, text=True).stdout.strip()
                  missing = [p for p in src.get("required", []) if not (dest / p).is_file()]
                  print(name, "revision", head, "expect", src.get("commit"), "missing", len(missing))
                  if head != src.get("commit"):
                      sys.exit("%s: revision %s != locked %s" % (name, head, src.get("commit")))
                  if missing:
                      print("missing sample:", missing[:5])
                      sys.exit("%s: %d required files missing" % (name, len(missing)))
          print("driver sources ready")
          PY

      - name: Patch 27 board link to compile the WiFi firmware loader
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          python3 - "$ROOT" <<'PY'
          import pathlib
          import sys

          p = pathlib.Path(sys.argv[1]) / "device" / "scripts" / "build-gop-legacy-display-27.py"
          text = p.read_text()
          anchor = "board_objects += [Path(line.split(' ', 1)[1]) for line in run(['python3', ROOT / 'scripts/build-ath12k-wifi.py'"
          if "package/WifiFirmware.c" in text:
              print("already compiles WifiFirmware.c")
          else:
              if text.count(anchor) != 1:
                  sys.exit("anchor not found exactly once: %d" % text.count(anchor))
              inject = (
                  "# Board: the WiFi firmware loader the probe calls (package/WifiFirmware.c in the device repo).\n"
                  "if not (KITS / 'WifiFirmware.c').exists():\n"
                  "    (KITS / 'WifiFirmware.c').write_bytes((DEVICE / 'package/WifiFirmware.c').read_bytes())\n"
                  "compile_c(KITS / 'WifiFirmware.c', board_dir / 'WifiFirmware.o', 'bsd/DEVELOPMENT/kern_exec.o.json')\n"
                  "board_objects.append(board_dir / 'WifiFirmware.o')\n"
              )
              p.write_text(text.replace(anchor, inject + anchor))
              print("patched", p)
          PY

      - name: Select header_version 3 for the boot image
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          python3 - "$ROOT" <<'PY'
          import pathlib
          import sys

          p = pathlib.Path(sys.argv[1]) / "device" / "board.toml"
          text = p.read_text()
          if '["bootimg"."image"]' in text:
              print("board.toml already overrides bootimg.image")
          else:
              text = text.rstrip("\n") + '\n\n["bootimg"."image"]\n"header_version" = 3\n'
              p.write_text(text)
              print("added [bootimg.image] header_version = 3")
          PY
          grep -n -A3 'bootimg"."image' "$ROOT/device/board.toml"

      - name: Add UniXNU probe logging
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          python3 -c "import base64,pathlib;pathlib.Path('/tmp/apply_probe.py').write_bytes(base64.b64decode(''))"
          python3 /tmp/apply_probe.py "$ROOT/UniXNU/package/UniXNUPkg/Library/UniXNULib/Config.c"
          grep -n "probe: blockio\|probe: volume" "$ROOT/UniXNU/package/UniXNUPkg/Library/UniXNULib/Config.c"

      - name: Build package 27 with first-install Data seed
        script: |
          set -o pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$(brew --prefix bison)/bin:$PATH"
          echo "cargo: $(command -v cargo) $(cargo --version 2>&1)"
          export UNIXNU_UNIQUE_CHIP_ID="9732b499"
          export GITHUB_TOKEN="${GH_TOKEN:-}"
          cd "$ROOT/device"
          set +e
          scripts/package.sh --os 27 --uefi "$ROOT/uefi-sheng" --init-data 2>&1 | tee "$CM_BUILD_DIR/package27.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "=== package rc=$rc ==="
          exit "$rc"

      - name: Collect images and Data seed
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR/pkg27"
          OUT="$CM_BUILD_DIR/out27"
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$CM_BUILD_DIR/package27.log" "$OUT/" || true

          BASE="$ROOT/UniXNU/out/sheng/ipados-27.0.1-24A446"
          find "$BASE" -type f \( -name 'boot.img' -o -name 'payload.img' -o -name 'kernel.macho' -o -name 'package.manifest.json' -o -name 'data.dbr' -o -name 'inputs.json' \) -exec cp {} "$OUT/" \; 2>/dev/null || true
          find "$ROOT/UniXNU/out/sheng" -type f -name 'sheng.dtb' -exec cp {} "$OUT/" \; 2>/dev/null || true

          cd "$OUT"
          ls -lh
          shasum -a 256 boot.img payload.img kernel.macho data.dbr 2>/dev/null || true
          for f in boot.img payload.img data.dbr package.manifest.json; do
            [ -f "$f" ] || echo "MISSING $f"
          done

    artifacts:
      - out27/*
