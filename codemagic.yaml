workflows:
  xnu-kernel:
    name: Build XNU kernel for sheng
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        DEVICE_REPO: https://github.com/16Crow/UniXNU-sheng.git
    scripts:
      - name: Clone device repo
        script: |
          rm -rf device
          git clone --depth 1 $DEVICE_REPO device
      - name: Fetch feeds and IPSW
        script: |
          ./unixnu fetch
          ./unixnu ipsw fetch
      - name: Defconfig
        script: |
          ./unixnu defconfig sheng_defconfig -D device
      - name: Build kernel
        script: |
          ./unixnu build kernel -j 8
    artifacts:
      - out/**/kernel.macho
      - out/**/kernel.json
      - build/**/*.a
