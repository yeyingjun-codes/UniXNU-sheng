workflows:
  sheng-kernel:
    name: Build sheng kernel (16Crow pipeline + owner mount stage probes)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - github
      vars:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
    scripts:
      - name: Clone repos
        script: |
          set -e
          echo "GITHUB_TOKEN=$GH_TOKEN" >> $CM_ENV
          cd $CM_BUILD_DIR
          git clone --depth 1 --recurse-submodules --branch sheng-evidence https://github.com/16Crow/UniXNU-official-build.git main
          git clone --depth 1 --recurse-submodules https://github.com/16Crow/UniXNU-sheng.git device
          cd main
          chmod +x unixnu
          echo "MAIN_DIR=$CM_BUILD_DIR/main" >> $CM_ENV
          echo "DEVICE_DIR=$CM_BUILD_DIR/device" >> $CM_ENV
          echo "UNIXNU_DEVICE=$CM_BUILD_DIR/device" >> $CM_ENV
          echo "DEFCONFIG=sheng_defconfig" >> $CM_ENV
          echo "STEPS=kernel" >> $CM_ENV
      - name: Install host tools
        script: |
          set -e
          brew install llvm lld mtools dtc qemu unifdef cmake ninja
          echo "PATH=$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH" >> $CM_ENV
      - name: Verify tools
        script: |
          cd $MAIN_DIR
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          for t in git make clang cmake ninja unifdef ld.lld mformat mcopy dtc qemu-system-aarch64 shasum; do
            echo "$t=$(command -v $t || echo MISSING)"
          done
      - name: Select device
        script: |
          cd $MAIN_DIR
          ./unixnu defconfig "$DEFCONFIG"
      - name: Inject RamBlock fast path
        script: |
          set -x
          mkdir -p /tmp/ramblock
          cp ci/RamBlock/NativeRamBlock.cpp /tmp/ramblock/NativeRamBlock.cpp
          echo "source fastpath count: $(grep -c 'data fastpath' /tmp/ramblock/NativeRamBlock.cpp)"
          python3 - <<'PY'
          from pathlib import Path
          patched = 0
          for name in ('main/scripts/prepare-sheng-evidence.sh', 'main/scripts/prepare-sheng-complete.sh'):
              p = Path(name)
              if not p.is_file():
                  continue
              t = p.read_text()
              if 'INJECT-RAMBLOCK' in t:
                  print('already', name); continue
              block = (
                  '# INJECT-RAMBLOCK: overlay our RamBlock immediately before the real kernel build\n'
                  'for _f in $(find "$ROOT/out" -path "*/tree/drivers/RamBlock/NativeRamBlock.cpp" 2>/dev/null); do\n'
                  '  cp -f /tmp/ramblock/NativeRamBlock.cpp "$_f"\n'
                  '  echo "INJECT-RAMBLOCK $_f -> $(grep -c \'data fastpath\' "$_f")\n"\n'
                  'done\n'
              )
              if './unixnu build kernel' in t:
                  t = t.replace('./unixnu build kernel', block + './unixnu build kernel')
                  p.write_text(t)
                  patched += 1
                  print('patched', name, 'occurrences', t.count('INJECT-RAMBLOCK'))
          print('files patched', patched)
          PY
          grep -c "INJECT-RAMBLOCK" main/scripts/prepare-sheng-complete.sh
          grep -n "INJECT-RAMBLOCK" main/scripts/prepare-sheng-complete.sh | head -4
      - name: Prepare evidence and build kernel
        script: |
          set -euo pipefail
          cd $MAIN_DIR
          export GITHUB_TOKEN=$GH_TOKEN
          export UNIXNU_DEVICE=$DEVICE_DIR
          export STEPS=kernel
          export DEFCONFIG=sheng_defconfig
          bash scripts/prepare-sheng-evidence.sh
          echo "=== PIPELINE DONE ==="
          ls -lh out/sheng/kernel/
          shasum -a 256 out/sheng/kernel/kernel.macho
          shasum -a 256 out/sheng/kernel/kernel.json
    artifacts:
      - main/out/sheng/kernel/kernel.macho
      - main/out/sheng/kernel/kernel.json
      - main/out/sheng/logs/*.log
