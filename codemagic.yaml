workflows:
  sheng-kernel:
    name: Build sheng kernel from CURRENT UniXNU main (official macos.yml equivalent)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - github
      vars:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
    scripts:
      - name: Clone current main + device repo (with submodules)
        script: |
          set -e
          cd $CM_BUILD_DIR
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/UniXNU/UniXNU.git main
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/UniXNU/UniXNU-sheng.git device
          cd main
          chmod +x unixnu
          git log --oneline -1
          cd ../device
          git log --oneline -1
          cd ../main
          echo "MAIN_DIR=$CM_BUILD_DIR/main" >> $CM_ENV
          echo "DEVICE_DIR=$CM_BUILD_DIR/device" >> $CM_ENV
      - name: Install host tools
        script: |
          set -e
          brew install llvm lld mtools dtc unifdef cmake ninja
          echo "PATH=$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH" >> $CM_ENV
      - name: Report toolchain
        script: |
          cd $MAIN_DIR
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
      - name: Defconfig
        script: |
          cd $MAIN_DIR
          ./unixnu defconfig sheng_defconfig --device "$DEVICE_DIR"
      - name: Fetch inputs (IPSW components and modules)
        script: |
          set -e
          cd $MAIN_DIR
          export GITHUB_TOKEN=$GH_TOKEN
          ./unixnu fetch --device "$DEVICE_DIR" 2>&1 | tail -40
      - name: Build kernel
        script: |
          set -e
          cd $MAIN_DIR
          export GITHUB_TOKEN=$GH_TOKEN
          ./unixnu build kernel --device "$DEVICE_DIR" 2>&1 | tail -60
          echo "=== KERNEL DONE ==="
          ls -lh out/sheng/ipados-17.7.11-21H461/sheng/kernel/
          shasum -a 256 out/sheng/ipados-17.7.11-21H461/sheng/kernel/kernel.macho
          cat out/sheng/ipados-17.7.11-21H461/sheng/kernel/kernel.json | head -c 600 || true
    artifacts:
      - main/out/sheng/ipados-17.7.11-21H461/sheng/kernel/kernel.macho
      - main/out/sheng/ipados-17.7.11-21H461/sheng/kernel/kernel.json
      - main/out/sheng/ipados-17.7.11-21H461/sheng/logs/*.log
