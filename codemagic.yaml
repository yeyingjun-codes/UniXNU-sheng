workflows:
  sheng-kernel:
    name: Build sheng kernel (16Crow pipeline + owner mount stage probes)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - github
      vars:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
    scripts:
      - name: Clone repos
        script: |
          set -e
          echo "GITHUB_TOKEN=$GH_TOKEN" >> $CM_ENV
          cd $CM_BUILD_DIR
          git clone --depth 1 --recurse-submodules --branch sheng-evidence https://github.com/16Crow/UniXNU-official-build.git main
          git clone --depth 1 --recurse-submodules https://github.com/16Crow/UniXNU-sheng.git device
          cd main
          chmod +x unixnu
          echo "MAIN_DIR=$CM_BUILD_DIR/main" >> $CM_ENV
          echo "DEVICE_DIR=$CM_BUILD_DIR/device" >> $CM_ENV
          echo "UNIXNU_DEVICE=$CM_BUILD_DIR/device" >> $CM_ENV
          echo "DEFCONFIG=sheng_defconfig" >> $CM_ENV
          echo "STEPS=kernel" >> $CM_ENV
      - name: Apply UFS poll cap + owner mount stage probes
        script: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) UFS poll cap (as before)
          for cand in ('main/drivers/NativeUfs/TransferPoll.h', 'device/drivers/ShengUfs/TransferPoll.h'):
              p = Path(cand)
              if p.exists():
                  text = p.read_text()
                  old = '    ++state.polls;\n'
                  new = ('    ++state.polls;\n'
                         '    if (state.polls > 1000000U) return UfsTransferEnd::Timeout;\n')
                  if '1000000U' not in text:
                      assert old in text, 'poll anchor missing'
                      p.write_text(text.replace(old, new, 1))
                  print('poll cap present in', cand)
                  break

          # 2) Owner mount stage probes: insert boot_progress_stage calls in the patch file
          patch = Path('main/patches/xnu/offline-owner-systemos-mount.patch')
          text = patch.read_text()
          probes = [
              ('+\tnative_owner_cache_stage = 1;\n', 'owner stage 1 root auth'),
              ('+\tnative_owner_cache_stage = 2;\n', 'owner stage 2 device select'),
              ('+\tnative_owner_cache_stage = 3;\n', 'owner stage 3 mount call'),
              ('+\tnative_owner_cache_stage = 4;\n', 'owner stage 4 lookup'),
              ('+\tnative_owner_cache_stage = 5;\n', 'owner stage 5 env'),
              ('+\tnative_owner_cache_stage = 6;\n', 'owner stage 6 done'),
          ]
          count = 0
          for anchor, msg in probes:
              if anchor in text and f'"{msg}"' not in text:
                  inject = anchor + '+\tboot_progress_stage("' + msg + '");\n'
                  text = text.replace(anchor, inject, 1)
                  count += 1
          patch.write_text(text)
          print('owner stage probes inserted:', count)
          assert count >= 4, 'expected at least 4 stage anchors'
          PY
      - name: Install host tools
        script: |
          set -e
          brew install llvm lld mtools dtc qemu unifdef cmake ninja
          echo "PATH=$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH" >> $CM_ENV
      - name: Verify tools
        script: |
          cd $MAIN_DIR
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          for t in git make clang cmake ninja unifdef ld.lld mformat mcopy dtc qemu-system-aarch64 shasum; do
            echo "$t=$(command -v $t || echo MISSING)"
          done
      - name: Select device
        script: |
          cd $MAIN_DIR
          ./unixnu defconfig "$DEFCONFIG"
      - name: Prepare evidence and build kernel
        script: |
          set -euo pipefail
          cd $MAIN_DIR
          export GITHUB_TOKEN=$GH_TOKEN
          export UNIXNU_DEVICE=$DEVICE_DIR
          export STEPS=kernel
          export DEFCONFIG=sheng_defconfig
          bash scripts/prepare-sheng-evidence.sh
          echo "=== PIPELINE DONE ==="
          ls -lh out/sheng/kernel/
          shasum -a 256 out/sheng/kernel/kernel.macho
          shasum -a 256 out/sheng/kernel/kernel.json
    artifacts:
      - main/out/sheng/kernel/kernel.macho
      - main/out/sheng/kernel/kernel.json
      - main/out/sheng/logs/*.log
